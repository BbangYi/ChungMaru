<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">GPR 기반 조기경보 백테스트 요약</title>
  <desc id="desc">41개 이벤트 중 26개 사전 탐지, Recall 63.4%, 평균 Lead Time 20.5일을 보여주는 발표용 요약 그래프</desc>
  <rect width="1200" height="720" fill="#f8fbff"/>
  <rect x="48" y="48" width="1104" height="624" fill="#ffffff" stroke="#d7e0ec" stroke-width="2"/>
  <text x="82" y="108" fill="#12243b" font-family="IBM Plex Sans KR, sans-serif" font-size="42" font-weight="800">GPR-Threat 조기경보 백테스트</text>
  <text x="82" y="150" fill="#60718a" font-family="IBM Plex Sans KR, sans-serif" font-size="22" font-weight="700">Threshold 기반 위험 신호 · 발표용 요약</text>

  <g transform="translate(82 214)">
    <rect width="280" height="180" fill="#f3f7fc" stroke="#d1dbe8"/>
    <text x="28" y="52" fill="#3e638f" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="800">TOTAL EVENTS</text>
    <text x="28" y="126" fill="#12243b" font-family="IBM Plex Mono, monospace" font-size="72" font-weight="900">41</text>
  </g>

  <g transform="translate(410 214)">
    <rect width="280" height="180" fill="#f3f7fc" stroke="#d1dbe8"/>
    <text x="28" y="52" fill="#3e638f" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="800">PRE-DETECTED</text>
    <text x="28" y="126" fill="#2f65d9" font-family="IBM Plex Mono, monospace" font-size="72" font-weight="900">26</text>
  </g>

  <g transform="translate(738 214)">
    <rect width="280" height="180" fill="#f3f7fc" stroke="#d1dbe8"/>
    <text x="28" y="52" fill="#3e638f" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="800">LEAD TIME</text>
    <text x="28" y="126" fill="#2f6f94" font-family="IBM Plex Mono, monospace" font-size="62" font-weight="900">20.5d</text>
  </g>

  <g transform="translate(82 470)">
    <text x="0" y="-22" fill="#12243b" font-family="IBM Plex Sans KR, sans-serif" font-size="24" font-weight="800">Recall</text>
    <rect x="0" y="0" width="760" height="48" fill="#e8eef6"/>
    <rect x="0" y="0" width="482" height="48" fill="#2f65d9"/>
    <text x="786" y="35" fill="#12243b" font-family="IBM Plex Mono, monospace" font-size="34" font-weight="900">63.4%</text>
  </g>

  <g transform="translate(82 575)">
    <circle cx="18" cy="18" r="18" fill="#2f9e6d"/>
    <circle cx="184" cy="18" r="18" fill="#d3a12f"/>
    <circle cx="350" cy="18" r="18" fill="#d67232"/>
    <circle cx="516" cy="18" r="18" fill="#c44d4d"/>
    <text x="44" y="25" fill="#12243b" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="800">GREEN</text>
    <text x="210" y="25" fill="#12243b" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="800">YELLOW</text>
    <text x="376" y="25" fill="#12243b" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="800">ORANGE</text>
    <text x="542" y="25" fill="#12243b" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="800">RED</text>
  </g>
</svg>
