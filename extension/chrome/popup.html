<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>청마루</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell" data-state="ready">
      <header class="topbar">
        <div>
          <p class="eyebrow">청마루</p>
          <h1>브라우저 보호</h1>
        </div>
        <label class="power-switch" title="필터링 활성화">
          <input id="enabledToggle" type="checkbox" />
          <span></span>
        </label>
      </header>

      <section class="status-panel">
        <div class="status-head">
          <div>
            <p id="currentDomain" class="domain">현재 사이트</p>
            <strong id="protectionSummary">상태 확인 중</strong>
          </div>
          <span id="siteVerdictBadge" class="verdict-badge">확인 중</span>
        </div>

        <div class="usage-grid">
          <article>
            <span>오늘 웹 사용</span>
            <strong id="todayUsage">0분</strong>
          </article>
          <article>
            <span>현재 페이지 감지</span>
            <strong id="siteDetections">0개</strong>
          </article>
        </div>

        <div class="feature-toggle-grid" aria-label="보호 기능과 위젯">
          <label class="feature-toggle">
            <span>텍스트</span>
            <input id="textMaskingToggle" type="checkbox" />
            <i aria-hidden="true"></i>
          </label>
          <label class="feature-toggle">
            <span>사이트</span>
            <input id="siteProtectionToggle" type="checkbox" />
            <i aria-hidden="true"></i>
          </label>
          <label class="feature-toggle">
            <span>이미지</span>
            <input id="mediaSafetyToggle" type="checkbox" />
            <i aria-hidden="true"></i>
          </label>
          <label class="feature-toggle">
            <span>위젯</span>
            <input id="widgetToggle" type="checkbox" />
            <i aria-hidden="true"></i>
          </label>
        </div>

        <div id="backendStatusCard" class="backend-status" data-status="checking">
          <div>
            <span>분석 서버</span>
            <strong id="backendStatusText">확인 중</strong>
            <small id="backendStatusDetail">-</small>
          </div>
          <button id="backendRefreshButton" type="button">재확인</button>
        </div>
      </section>

      <section class="control-panel settings-panel">
        <div class="panel-head">
          <div>
            <h2>필터 강도</h2>
            <p id="sensitivityHint">보통</p>
          </div>
          <strong id="sensitivityLabel">60</strong>
        </div>
        <input id="sensitivityRange" type="range" min="0" max="100" step="5" />

        <div class="setting-block">
          <h2>감지 범위</h2>
          <div class="chip-grid">
            <label><input id="catInsult" type="checkbox" />욕설</label>
            <label><input id="catAbuse" type="checkbox" />공격</label>
            <label><input id="catHate" type="checkbox" />혐오</label>
          </div>
        </div>

        <div class="setting-block">
          <h2>처리 방식</h2>
          <div class="mode-row">
            <label><input type="radio" name="mode" value="mask" />가리기</label>
            <label><input type="radio" name="mode" value="blur" />흐리기</label>
            <label><input type="radio" name="mode" value="hide" />숨기기</label>
            <label><input type="radio" name="mode" value="remove" />삭제</label>
          </div>
        </div>
      </section>

      <footer class="actions">
        <button id="applyNowButton" class="btn primary" type="button">현재 페이지 검사</button>
        <button id="openOptionsButton" class="btn ghost" type="button">상세 설정</button>
      </footer>

      <p id="statusMessage" class="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
