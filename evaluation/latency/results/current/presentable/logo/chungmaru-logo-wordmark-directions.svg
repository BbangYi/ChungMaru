<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-label="Chungmaru logo wordmark directions">
  <defs>
    <style>
      :root {
        --bg: #f7f9fa;
        --tile: #ffffff;
        --ink: #1f2428;
        --muted: #667078;
        --line: #d6dde2;
        --blue: #477f9a;
        --blue-2: #7faec2;
        --blue-soft: #dceaf0;
        --mask: #a8c3d0;
        --warm: #d68b5a;
      }
      text {
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      }
      .bg { fill: var(--bg); }
      .tile {
        fill: var(--tile);
        stroke: var(--line);
        stroke-width: 2;
      }
      .label {
        fill: var(--muted);
        font-size: 28px;
        font-weight: 750;
        letter-spacing: .14em;
      }
      .title {
        fill: var(--ink);
        font-size: 126px;
        font-weight: 900;
        letter-spacing: -.045em;
      }
      .roman {
        fill: var(--muted);
        font-size: 28px;
        font-weight: 800;
        letter-spacing: .20em;
      }
      .caption {
        fill: var(--muted);
        font-size: 31px;
        font-weight: 720;
        letter-spacing: -.02em;
      }
      .small {
        fill: var(--muted);
        font-size: 23px;
        font-weight: 720;
        letter-spacing: -.015em;
      }
      .stroke {
        fill: none;
        stroke: var(--blue);
        stroke-width: 18;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin-stroke {
        fill: none;
        stroke: var(--blue);
        stroke-width: 10;
        stroke-linecap: round;
      }
      .text-line {
        fill: none;
        stroke: var(--ink);
        stroke-width: 18;
        stroke-linecap: round;
      }
      .text-line-muted {
        fill: none;
        stroke: #a1a9ae;
        stroke-width: 16;
        stroke-linecap: round;
      }
      .mask {
        fill: var(--mask);
      }
      .mask-dark {
        fill: var(--blue);
      }
      .floor {
        fill: var(--blue-soft);
        stroke: var(--blue);
        stroke-width: 4;
      }
      .accent { fill: var(--warm); }
    </style>
  </defs>

  <rect class="bg" width="2400" height="1600" />
  <text x="120" y="132" class="label">CHUNGMARU LOGO DIRECTIONS</text>
  <text x="120" y="182" class="small">워드마크를 중심으로 두고, 마스킹 장치는 작게 붙인 방향</text>

  <!-- A -->
  <g transform="translate(120 250)">
    <rect class="tile" width="1020" height="560" rx="42" />
    <text x="64" y="86" class="label">A. WORDMARK + MASK</text>
    <g transform="translate(108 192)">
      <text x="0" y="116" class="title">청마루</text>
      <rect x="258" y="40" width="210" height="76" rx="22" class="mask" opacity=".86" />
      <text x="0" y="178" class="roman">CHUNGMARU</text>
      <path d="M0 232 H544" class="thin-stroke" opacity=".9" />
    </g>
    <text x="64" y="488" class="caption">가장 직접적. 이름을 먼저 읽히게 하고 일부 획만 가림.</text>
  </g>

  <!-- B -->
  <g transform="translate(1260 250)">
    <rect class="tile" width="1020" height="560" rx="42" />
    <text x="64" y="86" class="label">B. BLUE MARU BASE</text>
    <g transform="translate(118 178)">
      <path d="M20 222 C94 152 189 112 306 112 H552 C642 112 700 154 726 222 C650 259 526 278 368 278 C202 278 82 259 20 222Z" class="floor" />
      <text x="54" y="122" class="title">청마루</text>
      <rect x="414" y="57" width="174" height="64" rx="20" class="mask-dark" opacity=".86" />
      <text x="58" y="340" class="roman">CHUNGMARU</text>
    </g>
    <text x="64" y="488" class="caption">청색의 마루를 살림. 받침은 서비스명과 연결.</text>
  </g>

  <!-- C -->
  <g transform="translate(120 900)">
    <rect class="tile" width="1020" height="560" rx="42" />
    <text x="64" y="86" class="label">C. TEXT FILTER SYMBOL</text>
    <g transform="translate(110 164)">
      <rect x="0" y="36" width="238" height="238" rx="56" fill="#e7f0f4" stroke="#477f9a" stroke-width="5" />
      <path d="M54 104 H190" class="text-line" />
      <path d="M54 154 H190" class="text-line-muted" />
      <path d="M54 204 H190" class="text-line" />
      <rect x="114" y="132" width="82" height="46" rx="14" class="mask-dark" opacity=".88" />
      <text x="300" y="148" class="title">청마루</text>
      <text x="304" y="214" class="roman">CHUNGMARU</text>
    </g>
    <text x="64" y="488" class="caption">심볼을 쓰되 과하지 않게. 텍스트 일부 마스킹이 명확.</text>
  </g>

  <!-- D -->
  <g transform="translate(1260 900)">
    <rect class="tile" width="1020" height="560" rx="42" />
    <text x="64" y="86" class="label">D. SOFT FILTER BAR</text>
    <g transform="translate(104 185)">
      <text x="0" y="118" class="title">청마루</text>
      <path d="M26 178 H556" class="thin-stroke" opacity=".28" />
      <path d="M26 214 H410" class="thin-stroke" opacity=".28" />
      <rect x="214" y="161" width="154" height="42" rx="18" class="mask-dark" opacity=".88" />
      <path d="M390 166 H514" class="thin-stroke" opacity=".85" />
      <text x="0" y="254" class="roman">CHUNGMARU</text>
    </g>
    <text x="64" y="488" class="caption">가장 차분한 방향. 마스킹은 보이지만 로고가 과하지 않음.</text>
  </g>
</svg>
